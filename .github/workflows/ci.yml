name: ci
# Tipos, testes de regressão das fórmulas e build a cada push. Não usa a chave da API PriceTax.
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
